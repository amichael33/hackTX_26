<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Low-Poly Store</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="js/components/room.js"></script>
  <script src="js/components/shelf.js"></script>
  <script src="js/components/rack.js"></script>
  <script src="js/components/desk.js"></script>
  <script src="js/components/clerk.js"></script>
  <script src="js/collide.js"></script>
  <script src="js/components/bounds.js"></script>
  <script src="js/components/disco-ball.js"></script>
  <script src="js/components/zone-banner.js"></script>
  <script src="js/sticker.js"></script>
  <script src="js/cutout.js"></script>
  <script src="js/components/product-box.js"></script>
  <script src="js/components/shopping-cart.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/ui.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a-scene vr-mode-ui="enabled:false" renderer="colorManagement:true">
    <a-entity light="type:hemisphere; color:#ffffff; groundColor:#8a7a6a; intensity:0.9"></a-entity>
    <a-entity light="type:point; color:#fff4e0; intensity:0.6; distance:30" position="0 3.5 0"></a-entity>
    <a-entity light="type:point; color:#fff4e0; intensity:0.5; distance:20" position="0 3.5 6"></a-entity>

    <a-entity disco-ball position="0 3.5 0"></a-entity>

    <a-entity room="width:16; depth:20; height:4"></a-entity>

    <!-- Rig sits at eye height (y 1.6) so look-controls pitch/yaw pivot at the eyes; camera world y = 1.6. -->
    <a-entity id="rig" position="0 1.6 9" wasd-controls="enabled:false" look-controls="pointerLockEnabled:false" bounds="minX:-7.5; maxX:7.5; minZ:-9.5; maxZ:9.5">
      <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
    </a-entity>

    <a-entity id="cart3d" shopping-cart></a-entity>

    <a-entity id="desk" desk position="0 0 6.5"></a-entity>
    <a-entity id="clerk" clerk="state: idle" position="0 0 5.8"></a-entity>

    <a-entity id="shelves" visible="false">
      <!-- left wall, facing +x -->
      <a-entity shelf="width:2; rows:3" position="-7.2 0 -5" rotation="0 90 0"><a-entity zone-banner="text:Budget Picks; width:2" position="0 2 0.02"></a-entity></a-entity>
      <a-entity shelf="width:2; rows:3" position="-7.2 0 0" rotation="0 90 0"><a-entity zone-banner="text:Budget Picks; width:2" position="0 2 0.02"></a-entity></a-entity>
      <a-entity shelf="width:2; rows:3" position="-7.2 0 5" rotation="0 90 0"><a-entity zone-banner="text:Budget Picks; width:2" position="0 2 0.02"></a-entity></a-entity>
      <!-- right wall, facing -x -->
      <a-entity shelf="width:2; rows:3" position="7.2 0 -5" rotation="0 -90 0"><a-entity zone-banner="text:Premium; width:2" position="0 2 0.02"></a-entity></a-entity>
      <a-entity shelf="width:2; rows:3" position="7.2 0 0" rotation="0 -90 0"><a-entity zone-banner="text:Premium; width:2" position="0 2 0.02"></a-entity></a-entity>
      <a-entity shelf="width:2; rows:3" position="7.2 0 5" rotation="0 -90 0"><a-entity zone-banner="text:Premium; width:2" position="0 2 0.02"></a-entity></a-entity>
      <!-- back wall, facing +z -->
      <a-entity shelf="width:2; rows:3" position="-4 0 -9.2"><a-entity zone-banner="text:You Might Also Need; width:2" position="0 2 0.02"></a-entity></a-entity>
      <a-entity shelf="width:2; rows:3" position="0 0 -9.2"><a-entity zone-banner="text:You Might Also Need; width:2" position="0 2 0.02"></a-entity></a-entity>
      <a-entity shelf="width:2; rows:3" position="4 0 -9.2"><a-entity zone-banner="text:You Might Also Need; width:2" position="0 2 0.02"></a-entity></a-entity>
      <!-- center units -->
      <a-entity shelf="width:2; rows:3" position="-3 0 0"><a-entity zone-banner="text:More Like This; width:2" position="0 2 0.02"></a-entity></a-entity>
      <a-entity shelf="width:2; rows:3" position="3 0 0"><a-entity zone-banner="text:More Like This; width:2" position="0 2 0.02"></a-entity></a-entity>
      <!-- island -->
      <a-entity id="island" position="0 0 0">
        <a-box position="0 0.77 0" width="2" height="0.06" depth="1.2" material="color:#d9bf98; flatShading:true; roughness:0.9; metalness:0"></a-box>
        <a-box position="0 0.37 0" width="1.4" height="0.74" depth="0.7" material="color:#f5f5f7; flatShading:true; roughness:0.9; metalness:0"></a-box>
        <!-- suspended banner: wires from the ceiling (y 4.0) to the banner's top corners (y 2.08) -->
        <a-cylinder position="-0.78 3.04 0" radius="0.004" height="1.92" material="color:#1d1d1f"></a-cylinder>
        <a-cylinder position="0.78 3.04 0" radius="0.004" height="1.92" material="color:#1d1d1f"></a-cylinder>
        <a-entity zone-banner="text:Best Matches; width:1.6" position="0 1.95 0"></a-entity>
      </a-entity>
    </a-entity>
    <a-entity id="products"></a-entity>
  </a-scene>

  <div id="intro">
    <h1>Welcome to the Store</h1>
    <p>Chat with our clerk, then browse shelves stocked just for you.</p>
    <button id="enter-btn" type="button">Enter store</button>
  </div>

  <div id="location-panel" hidden>
    <div id="location-buttons">
      <button id="share-loc-btn" type="button">Share my location</button>
      <button id="type-loc-btn" type="button">Type a city or ZIP</button>
    </div>
    <form id="location-form" hidden>
      <input id="location-input" type="text" autocomplete="off" placeholder="City or ZIP (blank = Austin)" aria-label="City or ZIP code">
      <button id="location-submit" type="submit">Go</button>
    </form>
    <p id="location-privacy">Your location is only used for this search.</p>
  </div>

  <aside id="chat-log" class="collapsed" hidden>
    <button id="chat-log-toggle" type="button" aria-expanded="false">Chat log</button>
    <ul id="chat-log-list" aria-live="polite"></ul>
  </aside>

  <aside id="cart-widget" class="collapsed" hidden>
    <button id="cart-tab" type="button" aria-expanded="false" aria-controls="cart-panel" aria-label="Toggle cart"><span aria-hidden="true">🛒</span> <span id="cart-count">0</span></button>
    <div id="cart-panel">
      <div id="cart-tabs" role="tablist">
        <button id="tab-cart" type="button" role="tab" aria-selected="true">Cart</button>
        <button id="tab-searches" type="button" role="tab" aria-selected="false">Searches</button>
      </div>
      <div id="cart-pane">
        <ul id="cart-list"></ul>
        <p id="cart-empty">Click a product and press Add to cart.</p>
        <p id="cart-footer" hidden></p>
      </div>
      <div id="searches-pane" hidden>
        <p class="searches-empty">No past searches yet.</p>
      </div>
    </div>
  </aside>

  <div id="hud">
    <div id="subtitle" hidden>
      <p id="subtitle-text" aria-live="polite"></p>
      <div id="subtitle-controls">
        <button id="skip-btn" type="button" hidden>Skip</button>
        <button id="mute-btn" type="button" aria-pressed="false">Mute</button>
      </div>
    </div>
    <p id="browse-hint" hidden>Esc closes the card &middot; WASD to move &middot; drag to look</p>
    <div id="chat-bar" hidden>
      <form id="chat-form">
        <input id="chat-input" type="text" autocomplete="off" placeholder="Tell the clerk what you want..." aria-label="Message the clerk" disabled>
        <button id="mic-btn" type="button" aria-label="Speak" hidden>Mic</button>
        <button id="send-btn" type="submit" disabled>Send</button>
      </form>
    </div>
  </div>
  <button id="new-search-btn" type="button" hidden>New search</button>
  <div id="product-card" role="dialog" aria-modal="false" aria-labelledby="card-title" hidden>
    <button id="card-close" type="button" aria-label="Close">&times;</button>
    <h2 id="card-title"></h2>
    <p id="card-price"></p>
    <p id="card-source"></p>
    <p id="card-rating"></p>
    <div id="card-actions">
      <button id="card-cart" type="button">Add to cart</button>
      <a id="card-buy" href="#" target="_blank" rel="noopener" hidden>Buy</a>
    </div>
  </div>
</body>
</html>
